<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Startup steps as the app names them (app_fr.arb), with the weighted
  // share of the bar done when each one is showing (BirdyGoLoadStep weights
  // 1, 4, 2, 2, 1). The timings are a plausible launch, replayed in a loop.
  steps() {
    return [
    { caption: 'Chargement…', done: 0, until: 1700 },
    { caption: 'Chargement du modèle de chants…', done: 0.1, until: 3300 },
    { caption: 'Chargement des espèces de ta région…', done: 0.5, until: 4200 },
    { caption: 'Chargement des fiches espèces…', done: 0.7, until: 5000 },
    { caption: 'Chargement de tes observations…', done: 0.9, until: 5500 },
    { caption: 'C’est prêt.', done: 1, until: 7200 },
    ];
  }
  componentDidMount() {
    this.elapsed = 0;
    this.timer = setInterval(() => {
      const steps = this.steps();
      this.elapsed = (this.elapsed + 100) % steps[steps.length - 1].until;
      const step = steps.findIndex(s => this.elapsed < s.until);
      if (step !== (this.state && this.state.step)) this.setState({ step });
    }, 100);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
  }
  renderVals() {
    const s = this.steps()[(this.state && this.state.step) || 0];
    return {
      caption: s.caption,
      percent: Math.round(s.done * 100),
      barTransform: 'scaleX(' + s.done + ')',
    };
  }
}
</script>
