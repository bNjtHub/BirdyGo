<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // Short synthesized song (three rising whistles), played on tap only:
  // browsers block sound before a user gesture.
  playChirp() {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!this.audio) this.audio = new Ctx();
    const ctx = this.audio;
    if (ctx.state === 'suspended') ctx.resume();
    const start = ctx.currentTime + 0.02;
    const notes = [[2900, 3900, 0], [3100, 4300, 0.16], [3400, 4700, 0.32], [4200, 3000, 0.52]];
    notes.forEach(([f0, f1, at]) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const t = start + at;
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f0, t);
      osc.frequency.exponentialRampToValueAtTime(f1, t + 0.1);
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.14);
    });
  }
  componentWillUnmount() {
    if (this.audio) this.audio.close();
  }
  renderVals() {
    return { chirp: () => this.playChirp() };
  }
}
</script>
