<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<style>
@font-face{font-family:'Fraunces';src:url('assets/fonts/Fraunces-Variable.ttf') format('truetype');font-weight:100 900;font-style:normal}
@font-face{font-family:'Fraunces';src:url('assets/fonts/Fraunces-Italic-Variable.ttf') format('truetype');font-weight:100 900;font-style:italic}
@font-face{font-family:'Atkinson';src:url('assets/fonts/AtkinsonHyperlegibleNext-Variable.ttf') format('truetype');font-weight:200 800}
html,body{margin:0;background:#DDE2DA}
a{color:#0B6E77;text-decoration:none}
a:hover{color:#13233A;text-decoration:underline}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;user-select:none}
@keyframes birdyIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes birdyFade{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes wingBar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@keyframes sing{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
button{font:inherit;color:inherit}
</style>
</helmet>

<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:40px;padding:32px 24px;box-sizing:border-box;font-family:Atkinson,sans-serif;color:#13233A;flex-wrap:wrap">

  <div style="width:260px;display:flex;flex-direction:column;gap:12px;flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px"><img src="fork/brand/birdygo-logo-static.svg" alt="" style="width:40px;height:40px"><div style="font-family:Fraunces;font-size:26px;font-weight:600;font-variation-settings:'SOFT' 100,'opsz' 26">BirdyGo · démo</div></div>
    <div style="font-size:15px;line-height:1.45;color:#6B5847;text-wrap:pretty">Tout est cliquable dans le téléphone. Lance une écoute, arrête-la, vérifie les détections : le carnet, le profil et l'accueil suivent.</div>
    <div style="background:#FFFFFF;border-radius:20px;padding:8px;display:flex;flex-direction:column">
      <sc-for list="{{ index }}" as="it" hint-placeholder-count="14">
        <button onClick="{{ it.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:{{ it.bg }};font-size:15px;font-weight:{{ it.weight }}" style-hover="background:#EEF1EC">
          <span class="ms" style="font-size:20px;color:#0B6E77">{{ it.icon }}</span>{{ it.label }}
        </button>
      </sc-for>
    </div>
    <button onClick="{{ simRare }}" style="all:unset;cursor:pointer;text-align:center;min-height:48px;padding:8px 14px;box-sizing:border-box;border-radius:20px;background:#FFFFFF;color:#13233A;font-weight:700;font-size:14px;line-height:1.3;display:flex;align-items:center;gap:8px"><span class="ms" style="font-size:20px;color:#7A5A00;font-variation-settings:'FILL' 1">diamond</span>Simuler : un oiseau rare chante (Huppe fasciée)</button>
    <button onClick="{{ simReturn }}" style="all:unset;cursor:pointer;text-align:center;min-height:48px;padding:8px 14px;box-sizing:border-box;border-radius:20px;background:#FFFFFF;color:#13233A;font-weight:700;font-size:14px;line-height:1.3;display:flex;align-items:center;gap:8px"><span class="ms" style="font-size:20px;color:#0B6E77">phone_iphone</span>Simuler : je reviens dans l'app et 3 nouvelles espèces ont chanté</button>
    <button onClick="{{ reset }}" style="all:unset;cursor:pointer;text-align:center;height:48px;border-radius:999px;background:#D6EEF0;color:#0B6E77;font-weight:700;font-size:15px;line-height:48px">Réinitialiser la démo</button>
  </div>

  <div style="width:390px;height:844px;border-radius:48px;border:8px solid #0B1728;background:{{ phoneBg }};position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(19,35,58,.18);flex-shrink:0">
    <div style="position:absolute;top:0;left:0;right:0;height:40px;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:15px;font-weight:700;color:{{ statusInk }};background:{{ statusBg }};pointer-events:none">
      <span>9:41</span><span style="display:flex;gap:4px"><span class="ms" style="font-size:18px">signal_cellular_alt</span><span class="ms" style="font-size:18px">battery_full</span></span>
    </div>
    <div style="position:absolute;top:40px;left:0;right:0;bottom:{{ screenBottom }};overflow:hidden">
      <sc-if value="{{ show.home }}" hint-placeholder-val="{{ true }}"><dc-import name="DemoAccueil" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.notebook }}"><dc-import name="DemoCarnet" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.map }}"><dc-import name="DemoCarte" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.profile }}"><dc-import name="DemoProfil" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.live }}"><dc-import name="DemoEcoute" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.bilan }}"><dc-import name="DemoBilan" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.review }}"><dc-import name="DemoRevue" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.species }}"><dc-import name="DemoFiche" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.quiz }}"><dc-import name="DemoQuiz" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.ranking }}"><dc-import name="DemoPalmares" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.sounds }}"><dc-import name="DemoSonotheque" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.settings }}"><dc-import name="DemoReglages" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
      <sc-if value="{{ show.goal }}"><dc-import name="DemoObjectif" app="{{ app }}" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import></sc-if>
    </div>

    <sc-if value="{{ show.nav }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:0;right:0;bottom:0;height:80px;background:#FFFFFF;display:grid;grid-template-columns:repeat(4,1fr);z-index:10">
        <sc-for list="{{ navItems }}" as="n" hint-placeholder-count="4">
          <button onClick="{{ n.go }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px">
            <div style="width:64px;height:32px;border-radius:999px;background:{{ n.ind }};display:flex;align-items:center;justify-content:center"><span class="ms" style="font-size:24px;color:{{ n.iconColor }};font-variation-settings:'FILL' {{ n.fill }}">{{ n.icon }}</span></div>
            <span style="font-size:13px;line-height:1.2;color:{{ n.labelColor }};font-weight:{{ n.weight }}">{{ n.label }}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ show.sheet }}">
      <div style="position:absolute;inset:0;z-index:40">
        <div onClick="{{ app.go.closeSheet }}" style="position:absolute;inset:0;background:rgba(12,24,41,.78);animation:birdyFade .2s"></div>
        <dc-import name="DemoSheets" app="{{ app }}" hint-size="100%,60%" style="position:absolute;left:0;right:0;bottom:0"></dc-import>
      </div>
    </sc-if>

    <sc-if value="{{ show.toast }}">
      <div style="position:absolute;left:16px;right:16px;bottom:{{ toastBottom }};z-index:50;background:#13233A;color:#EEF1EC;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.35;box-shadow:0 8px 28px rgba(19,35,58,.24);animation:birdyIn .2s;display:flex;gap:10px;align-items:center"><span class="ms" style="font-size:20px;color:#4FC3CC">{{ toastIcon }}</span><span>{{ toast }}</span></div>
    </sc-if>
  </div>
</div>
</x-dc>

      bilanMore: s.sheet === 'bilanMore', more: s.sheet === 'more', listen: s.sheet === 'listen', badge: !!bsel, choice: !!choice, area: s.sheet === 'area', levels: s.sheet === 'levels', rankSort: s.sheet === 'rankSort',
