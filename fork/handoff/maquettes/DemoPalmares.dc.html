<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;background:#EEF1EC;font-family:Atkinson,sans-serif;color:#13233A">
  <div style="padding:16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:12px;min-height:48px">
      <button onClick="{{ app.go.back }}" style="all:unset;cursor:pointer;width:48px;height:48px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><span class="ms" style="font-size:24px">arrow_back</span></button>
      <div style="flex:1;font-family:Fraunces;font-size:20px;line-height:1.25;font-weight:600;font-variation-settings:'SOFT' 100,'opsz' 20">Palmarès</div>
      <button onClick="{{ app.ranking.sort }}" style="all:unset;cursor:pointer;width:48px;height:48px;border-radius:999px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><span class="ms" style="font-size:24px">sort</span></button>
    </div>
    <div style="background:#D6EEF0;border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:birdyIn .3s both">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:34px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums">{{ app.ranking.count }}</span><span style="font-size:17px;line-height:1.45">{{ app.ranking.label }}</span></div>
        <div style="font-size:13px;color:#6B5847"><span style="color:#7A5A00;font-weight:800">{{ app.ranking.newCount }}</span> nouvelles en 2026{{ app.ranking.dates }}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><sc-for list="{{ app.ranking.periods }}" as="p" hint-placeholder-count="4"><button onClick="{{ p.pick }}" style="all:unset;cursor:pointer;height:48px;padding:0 14px;border-radius:999px;background:{{ p.bg }};color:{{ p.fg }};display:flex;align-items:center;font-size:15px;font-weight:700;transition:background .15s">{{ p.l }}</button></sc-for></div>
    </div>
    <div style="background:#FFFFFF;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:12px;animation:birdyIn .3s .04s both">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-family:Fraunces;font-size:20px;line-height:1.25;font-weight:600;font-variation-settings:'SOFT' 100,'opsz' 20">Podium</div>
        <button onClick="{{ app.ranking.toggleConfirmed }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;color:#6B5847;min-height:48px">Confirmées<div style="width:44px;height:28px;border-radius:999px;background:{{ app.ranking.confirmedTrack }};padding:3px;box-sizing:border-box;display:flex;justify-content:{{ app.ranking.confirmedJustify }}"><div style="width:22px;height:22px;border-radius:999px;background:#FFFFFF;box-shadow:0 1px 3px rgba(19,35,58,.25)"></div></div></button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end">
        <sc-for list="{{ app.ranking.podium }}" as="p" hint-placeholder-count="3">
          <div onClick="{{ p.open }}" style="cursor:pointer;min-height:{{ p.h }};border-radius:20px;background:{{ p.tint }};padding:10px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;box-shadow:{{ p.shadow }};animation:pop .45s both" style-active="transform:scale(.97)">
            <div style="width:32px;height:32px;border-radius:999px;border:1.5px solid {{ p.m.rim }};box-sizing:border-box;background:linear-gradient(135deg,{{ p.m.hi }},{{ p.m.base }} 55%,{{ p.m.sh }});display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:{{ p.m.ink }}">{{ p.rank }}</div>
            <div style="width:{{ p.av }};height:{{ p.av }};border-radius:999px;background:#FFFFFF;border:2px solid {{ p.accent }};box-sizing:border-box;display:flex;align-items:center;justify-content:center"><img src="{{ p.sil }}" alt="" style="width:62%;height:62%;object-fit:contain"></div>
            <div style="font-family:Fraunces;font-size:15px;line-height:1.2;font-weight:600;text-align:center;font-variation-settings:'SOFT' 100,'opsz' 15">{{ p.name }}</div>
            <div style="font-size:20px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums">{{ p.value }}</div>
            <div style="font-size:13px;color:#6B5847">{{ app.ranking.unit }}</div>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="background:#FFFFFF;border-radius:20px;padding:8px 16px;display:flex;flex-direction:column;animation:birdyIn .3s .08s both">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px">
        <div style="font-family:Fraunces;font-size:20px;line-height:1.25;font-weight:600;font-variation-settings:'SOFT' 100,'opsz' 20">Classement</div>
        <button onClick="{{ app.ranking.toggleOrder }}" style="all:unset;cursor:pointer;display:flex;align-items:center;font-size:13px;color:#6B5847;min-height:40px">{{ app.ranking.orderLabel }}<span class="ms" style="font-size:20px">expand_more</span></button>
      </div>
      <sc-for list="{{ app.ranking.rows }}" as="r" hint-placeholder-count="8">
        <div onClick="{{ r.open }}" style="cursor:pointer;min-height:60px;display:flex;align-items:center;border-top:{{ r.sep }}">
          <div style="width:28px;font-size:17px;font-weight:700;color:#6B5847">{{ r.rank }}</div>
          <div style="width:36px;height:36px;border-radius:999px;background:{{ r.tint }};border:1.5px solid {{ r.accent }}80;box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0"><img src="{{ r.sil }}" alt="" style="width:62%;height:62%;object-fit:contain"></div>
          <div style="flex:1;margin-left:10px;display:flex;flex-direction:column;gap:6px;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-family:Fraunces;font-size:17px;line-height:1.2;font-weight:600;font-variation-settings:'SOFT' 100,'opsz' 17">{{ r.name }}</span><sc-if value="{{ r.isNew }}"><span style="display:inline-flex;align-items:center;gap:5px;min-height:26px;box-sizing:border-box;border:1.5px solid #7A5A00;color:#7A5A00;border-radius:999px;padding:4px 10px 4px 7px;font-size:13px;font-weight:700;line-height:1"><span class="ms" style="font-size:14px;font-variation-settings:'FILL' 1">auto_awesome</span>Nouveau cette année</span></sc-if></div>
            <div style="height:8px;border-radius:999px;background:#DCE2DA;overflow:hidden"><div style="height:100%;width:{{ r.w }};background:{{ r.deep }};border-radius:999px;transition:width .6s cubic-bezier(.2,0,0,1)"></div></div>
          </div>
          <div style="width:44px;text-align:right;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums">{{ r.value }}</div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;app&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
